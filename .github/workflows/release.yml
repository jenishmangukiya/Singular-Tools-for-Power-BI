name: Build installers

on:
  push:
    branches: [ main ]
  workflow_dispatch:            # keeps a manual "Run workflow" button

# Allow the job to create/update the rolling Release with the built-in GITHUB_TOKEN.
permissions:
  contents: write

# A new push supersedes an in-flight build instead of queueing behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The test project references Core only, so test it directly instead of the
      # whole .slnx (which would also build the heavy WinUI app).
      - name: Test
        run: dotnet test tests/SingularTools.Tests/SingularTools.Tests.csproj -c Release --nologo

      # Inno Setup 6 is not on the runner; choco is preinstalled and installs into
      # Program Files (x86), which build-installers.ps1's Resolve-Iscc already probes.
      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build installers (x64, x86, arm64)
        shell: pwsh
        run: ./distribution/installer/build-installers.ps1 -Version "1.0.${{ github.run_number }}"

      # Short-lived safety net; the rolling release below is the real deliverable.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ github.run_number }}
          path: distribution/installer/output/*-Setup.exe
          retention-days: 5

      # A rolling release keeps exactly one entry ("latest-build"). Delete it first
      # (with its tag) so recreating it below always leaves exactly three assets and
      # points the tag at the current commit. Legacy per-push `build-*` releases from
      # the previous scheme are swept up here too. No-op on the very first run.
      - name: Delete previous rolling + legacy releases
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @('latest-build')
          $legacy = gh release list --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -like 'build-*' }
          $tags += $legacy
          foreach ($t in ($tags | Select-Object -Unique)) {
            gh release delete $t --cleanup-tag -y
          }

      - name: Publish rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          body: |
            Rolling pre-release of **Singular Tools**.

            - Commit: `${{ github.sha }}`
            - Build: run #${{ github.run_number }} (installer version `1.0.${{ github.run_number }}`)
          files: distribution/installer/output/*-Setup.exe
